<div class="login-container">
  <div class="login-header">
    <img src="assets/images/logo.png" alt="Logo" class="login-logo" />
    <h1 class="login-title">BIENVENIDO</h1>
    <p class="login-subtitle">Es el momento de comenzar tu PRIMER PASO</p>
  </div>

  <form class="login-form" (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        (ngModelChange)="onEmailChange()"
        placeholder="ejemplo@correo.com"
        autocomplete="email"
      />
      <small *ngIf="emailError" style="color: red">{{ emailError }}</small>
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      <small style="color: #8b9dc3; font-size: 12px">
        Mínimo 8 caracteres, debe contener letras y números
      </small>
    </div>

    <div class="forgot-password">
      <a href="#">¿Olvidaste tu contraseña?</a>
    </div>

    <p *ngIf="error" style="color: red; text-align: center">{{ error }}</p>

    <button type="submit" class="btn-submit" [disabled]="cargando">
      {{ cargando ? 'Cargando...' : 'Iniciar Sesión' }}
    </button>
  </form>

  <div class="login-footer">
    <p>
      ¿Aún no tienes cuenta?
      <a routerLink="/register">Regístrate gratis</a>
    </p>
  </div>
</div>
