<div class="layout-wrapper">

    <div class="sidebar-header">
      <div class="brand">
        <img src="assets/imagenes/ProjectMateLogo.png" alt="Logo" class="logo-icon" />
        <span class="logo-text">ProjectManager</span>
      </div>
    </div>

    <nav class="menu">
      <a routerLink="/app/inicio" routerLinkActive="active" title="Inicio">
        <mat-icon>home</mat-icon>
        <span class="menu-label">Inicio</span>

      <a routerLink="/app/proyectos" routerLinkActive="active" title="Proyectos">
