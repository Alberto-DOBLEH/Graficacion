<div class="login-container">
  <div class="login-header">
    <img src="assets/imagenes/ProjectMateLogo.png" alt="Logo" class="login-logo" />
    <h1 class="login-title">BIENVENIDO</h1>
    <p class="login-subtitle">Es el momento de comenzar tu PRIMER PASO</p>
  </div>

  <form class="login-form" (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="ejemplo@correo.com"
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
    </div>

    <div class="forgot-password">
      <a href="#">¿Olvidaste tu contraseña?</a>
    </div>

    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="btn-submit" [disabled]="cargando">
      {{ cargando ? 'Entrando...' : 'Iniciar Sesión' }}
    </button>
  </form>

  <div class="login-footer">
    <p>
      ¿Aún no tienes cuenta?
      <a routerLink="/registro">Regístrate gratis</a>
    </p>
  </div>
</div>
